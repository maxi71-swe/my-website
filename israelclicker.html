<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Israeli Clicker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef7ff, #cfe8ff);
    color: #12345a;
    min-height: 100vh;
  }
  header {
    background: #fff;
    border-bottom: 4px solid #1677d2;
    padding: 18px 24px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
  }
  h1 { margin: 0; color: #1267b5; font-size: 34px; }
  .sub { margin-top: 5px; color: #66809b; }
  .game {
    width: min(1050px, 94%);
    margin: 30px auto;
    display: grid;
    grid-template-columns: 1fr 330px;
    gap: 22px;
  }
  .card {
    background: rgba(255,255,255,.94);
    border: 2px solid #b8dcfa;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(20,100,170,.12);
  }
  .score {
    text-align: center;
    font-size: 42px;
    font-weight: 800;
    color: #0d64ad;
  }
  .rate {
    text-align: center;
    color: #64809b;
    margin-top: 4px;
  }
  .click-area {
    min-height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    position: relative;
  }
  #clickImage {
    width: 285px;
    height: 285px;
    border-radius: 50%;
    cursor: pointer;
    user-select: none;
    transition: transform .08s ease, filter .08s ease;
    filter: drop-shadow(0 15px 20px rgba(18,103,181,.25));
  }
  #clickImage:hover { transform: scale(1.04); }
  #clickImage:active { transform: scale(.94); filter: brightness(1.08); }
  .hint { margin-top: 20px; color: #6a8298; }
  .shop h2 { margin-top: 0; color: #1267b5; }
  .upgrade {
    width: 100%;
    padding: 15px;
    margin: 9px 0;
    border: 2px solid #b8dcfa;
    border-radius: 13px;
    background: #f5fbff;
    color: #12345a;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
    transition: .15s;
  }
  .upgrade:hover:not(:disabled) {
    background: #e5f3ff;
    border-color: #1677d2;
    transform: translateY(-2px);
  }
  .upgrade:disabled { opacity: .5; cursor: not-allowed; }
  .upgrade strong { display: block; color: #1267b5; font-size: 17px; }
  .upgrade span { color: #6a8298; }
  .reset {
    width: 100%;
    margin-top: 12px;
    padding: 11px;
    border: 0;
    border-radius: 10px;
    background: #e8f3fc;
    color: #24618d;
    cursor: pointer;
  }
  .pop {
    position: absolute;
    pointer-events: none;
    font-weight: bold;
    color: #1267b5;
    font-size: 24px;
    animation: pop .7s forwards;
  }
  @keyframes pop {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-75px) scale(1.2); }
  }
  @media (max-width: 800px) {
    .game { grid-template-columns: 1fr; }
    .click-area { min-height: 420px; }
    #clickImage { width: 230px; height: 230px; }
  }
</style>
</head>

<iframe
    id="bgMusic"
    src="https://www.youtube.com/embed/XsmDC-IsfCg?autoplay=1&loop=1&playlist=XsmDC-IsfCg&controls=0&mute=0&playsinline=1"
    allow="autoplay; encrypted-media"
    style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-10px;top:-10px;">
</iframe>

<script>
document.addEventListener("click", function startMusic() {
    const music = document.getElementById("bgMusic");

    if (music) {
        music.src =
            "https://www.youtube.com/embed/XsmDC-IsfCg" +
            "?autoplay=1&loop=1&playlist=XsmDC-IsfCg&controls=0&mute=0&playsinline=1";
    }

    document.removeEventListener("click", startMusic);
}, { once: true });
</script>

  let autoCost = Number(localStorage.getItem("israeliAutoCost")) || 100;
  let megaCost = Number(localStorage.getItem("israeliMegaCost")) || 750;

  const scoreEl = document.getElementById("score");
  const perSecondEl = document.getElementById("perSecond");
  const clickImage = document.getElementById("clickImage");
  const clickArea = document.getElementById("clickArea");

  function save() {
    localStorage.setItem("israeliClickerScore", score);
    localStorage.setItem("israeliClickPower", clickPower);
    localStorage.setItem("israeliClickerAuto", auto);
    localStorage.setItem("israeliCursorCost", cursorCost);
    localStorage.setItem("israeliAutoCost", autoCost);
    localStorage.setItem("israeliMegaCost", megaCost);
  }

  function update() {
    scoreEl.textContent = Math.floor(score).toLocaleString();
    perSecondEl.textContent = auto.toLocaleString();

    document.getElementById("cursorCost").textContent = cursorCost.toLocaleString();
    document.getElementById("autoCost").textContent = autoCost.toLocaleString();
    document.getElementById("megaCost").textContent = megaCost.toLocaleString();

    document.getElementById("cursorBtn").disabled = score < cursorCost;
    document.getElementById("autoBtn").disabled = score < autoCost;
    document.getElementById("megaBtn").disabled = score < megaCost;
  }

  function clickGame() {
    score += clickPower;

    const pop = document.createElement("div");
    pop.className = "pop";
    pop.textContent = "+" + clickPower;
    pop.style.left = (clickArea.clientWidth / 2 + (Math.random()*80-40)) + "px";
    pop.style.top = "310px";
    clickArea.appendChild(pop);
    setTimeout(() => pop.remove(), 700);

    save();
    update();
  }

  clickImage.addEventListener("click", clickGame);

  document.getElementById("cursorBtn").onclick = () => {
    if (score >= cursorCost) {
      score -= cursorCost;
      clickPower += 1;
      cursorCost = Math.ceil(cursorCost * 1.55);
      save(); update();
    }
  };

  document.getElementById("autoBtn").onclick = () => {
    if (score >= autoCost) {
      score -= autoCost;
      auto += 1;
      autoCost = Math.ceil(autoCost * 1.65);
      save(); update();
    }
  };

  document.getElementById("megaBtn").onclick = () => {
    if (score >= megaCost) {
      score -= megaCost;
      clickPower += 10;
      megaCost = Math.ceil(megaCost * 1.8);
      save(); update();
    }
  };

  document.getElementById("resetBtn").onclick = () => {
    if (confirm("Reset your Israeli Clicker progress?")) {
      score = 0;
      clickPower = 1;
      auto = 0;
      cursorCost = 25;
      autoCost = 100;
      megaCost = 750;
      save();
      update();
    }
  };

  setInterval(() => {
    if (auto > 0) {
      score += auto;
      save();
      update();
    }
  }, 1000);

  update();
</script>
</body>

</html>
